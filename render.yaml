# Render Blueprint for the ORDINA AI backend (free plan). Database: Neon (free), not Render.
# Render → New → Blueprint → pick this repo. Guide: backend-ordina/DEPLOY-RENDER.md
services:
  - type: web
    name: ordina-api
    runtime: node
    plan: free
    region: ohio # same AWS region as the Neon project (us-east-2)
    rootDir: backend-ordina
    # Version 2 lives on this branch until it is merged into frontend-ordina-001.
    branch: feature/v1-tasks-ai
    buildCommand: npm ci
    # Applies database migrations (additive only), then starts the server.
    startCommand: npm run start:prod
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false # Neon POOLED connection string (host contains "-pooler"), used by the server
      - key: DATABASE_URL_UNPOOLED
        sync: false # Neon DIRECT connection string (no "-pooler"), used only for migrations
      - key: GEMINI_API_KEY
        sync: false # entered in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: RESEND_API_KEY
        sync: false # optional: password-reset emails (resend.com, free plan)
      - key: MAIL_FROM
        sync: false # optional: e.g. "ORDINA <no-reply@your-domain>" (a domain verified in Resend)
